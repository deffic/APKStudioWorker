name: Bootstrap APK Studio Worker

on:
  push:
    branches:
      - main
      - feature/ondevice-preflight-v02
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/apk-studio-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout standalone APK Studio Worker
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android platform
        shell: bash
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify GitHub ZIP importer without gradlew
        run: >-
          java scripts/RunGradleProjectLocatorTests.java
          app/src/main/java/online/apkstudio/worker/GradleProjectLocator.java
          scripts/TestGradleProjectLocator.java
      - name: Check Android Java source syntax
        run: java scripts/ValidateJava.java app/src/main/java/online/apkstudio/worker/*.java
      - name: Verify Gradle namespace and applicationId detection
        run: >-
          java scripts/RunBuildProfileTests.java
          app/src/main/java/online/apkstudio/worker/BuildProfile.java
          scripts/TestBuildProfile.java
      - name: Verify AAPT2 resource link and manifest preparation
        run: >-
          java scripts/RunResourceBuildTests.java
          app/src/main/java/online/apkstudio/worker/ResourceBuildStage.java
          scripts/TestResourceBuildStage.java
      - name: Prepare verified ARM64 AAPT2 for on-device resource compilation
        run: bash scripts/prepare_aapt2.sh
      - name: Build bootstrap APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Studio-Worker-v0.2.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
