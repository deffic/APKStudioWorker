plugins {
    id 'com.android.application'
}

android {
    namespace 'online.apkstudio.worker'
    compileSdk 35

    defaultConfig {
        applicationId 'online.apkstudio.worker'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-dev'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Android only exposes a packaged executable in nativeLibraryDir
            // when native files are extracted to disk during installation.
            useLegacyPackaging = true
        }
    }
}
